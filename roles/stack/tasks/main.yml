- name: Create Cloud-1 deployment Directory
  ansible.builtin.file:
    path: /opt/cloud-1
    state: directory
    mode: '0755'

- name: Deploy Docker Compose Configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/docker/docker-compose.yml"
    dest: /opt/cloud-1/docker-compose.yml
    mode: '0644'

- name: Create Cloud-1 secrets directory
  ansible.builtin.file:
    path: /opt/cloud-1/secrets
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deploy MariaDB root password
  ansible.builtin.copy:
    content: "{{ vault_mariadb_root_password }}"
    dest: /opt/cloud-1/secrets/db_root_password
    owner: root
    group: root
    mode: '0644'
  no_log: true

- name: Deploy MariaDB application password
  ansible.builtin.copy:
    content: "{{ vault_mariadb_wordpress_password }}"
    dest: /opt/cloud-1/secrets/db_password
    owner: root
    group: root
    mode: '0644'
  no_log: true

- name: Create Nginx config directory
  ansible.builtin.file:
    path: /opt/cloud-1/nginx
    state: directory
    mode: '0755'

- name: Install htpasswd utility
  ansible.builtin.apt:
    name: apache2-utils
    state: present

- name: Create phpMyAdmin access credentials
  ansible.builtin.command:
    argv:
      - htpasswd
      - -c
      - -i
      - -B
      - /opt/cloud-1/nginx/.htpasswd
      - "{{ vault_pma_gate_user }}"
    stdin: "{{ vault_pma_gate_password }}"
    stdin_add_newline: true
    creates: /opt/cloud-1/nginx/.htpasswd
  no_log: true

- name: Deploy Nginx configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/docker/nginx/{{ 'default.conf' if tls_cert.stat.exists else 'bootstrap.conf' }}"
    dest: /opt/cloud-1/nginx/default.conf
    mode: '0644'
  notify: Validate and reload Nginx

- name: Create ACME directory
  ansible.builtin.file:
    path: /opt/cloud-1/acme/.well-known/acme-challenge
    state: directory
    mode: '0755'

- name: Create temporary test file
  ansible.builtin.copy:
    content: "cloud1-acme-ready"
    dest: /opt/cloud-1/acme/.well-known/acme-challenge/test.txt
    mode: '0644'

- name: start Cloud-1 Docker Compose services
  community.docker.docker_compose_v2:
    project_src: /opt/cloud-1
    state: present
