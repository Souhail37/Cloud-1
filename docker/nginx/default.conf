server {
    listen  80;
    server_name cloud1-42project.duckdns.org;
    root    /var/www/html;
    index   index.php index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://cloud1-42project.duckdns.org$request_uri;
    }

}

server {
    listen  443 ssl;
    server_name cloud1-42project.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/cloud1-42project.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud1-42project.duckdns.org/privkey.pem;
    ssl_protocols   TLSv1.2 TLSv1.3;
    root /var/www/html;
    index index.php index.html;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass wordpress:9000;
    }

    location = /wp-admin/install.php {
        return 403;
    }

    location = /wp-admin/setup-config.php {
        return 403;
    }
}