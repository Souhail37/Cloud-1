server {
    listen  80;
    server_name cloud1-42project.duckdns.org;
    root    /var/www/html;
    index   index.php index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        # try_files $uri $uri/ /index.php?$args;
        return 403;
    }

    location ~ \.php$ {
        # try_files $uri =404;
        # include fastcgi_params;
        # fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # fastcgi_pass wordpress:9000;
        return 403;
    }
}

server {
    listen  443 ssl;
    server_name cloud1-42project.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/cloud1-42project.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud1-42project.duckdns.org/privkey.pem;
    ssl_protocols   TLSv1.2 TLSv1.3;

    location / {
        return 403;
    }
}