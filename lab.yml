---
- name: Cloud-1 Lab Configuration
  hosts: wordpress_hosts
  tasks:
    - name: Ensure curl is installed
      ansible.builtin.apt:
        name: curl
        state: present

    - name: Ensure python3-debian is installed
      ansible.builtin.apt:
        name: python3-debian
        state: present

    - name: Configure Docker official APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        signed_by: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Refresh APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Create Cloud-1 deployment Directory
      ansible.builtin.file:
        path: /opt/cloud-1
        state: directory
        mode: '0755'

    - name: Deploy Docker Compose Configuration
      ansible.builtin.copy:
        src: docker/docker-compose.yml
        dest: /opt/cloud-1/docker-compose.yml
        mode: '0644'

    - name: Create Cloud-1 secrets directory
      ansible.builtin.file:
        path: /opt/cloud-1/secrets
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Deploy MariaDB root password
      ansible.builtin.copy:
        content: "{{ vault_mariadb_root_password }}"
        dest: /opt/cloud-1/secrets/db_root_password
        owner: root
        group: root
        mode: '0644'
      no_log: true

    - name: Deploy MariaDB application password
      ansible.builtin.copy:
        content: "{{ vault_mariadb_wordpress_password }}"
        dest: /opt/cloud-1/secrets/db_password
        owner: root
        group: root
        mode: '0644'
      no_log: true

    - name: Create Nginx config directory
      ansible.builtin.file:
        path: /opt/cloud-1/nginx
        state: directory
        mode: '0755'
    
    - name: Install htpasswd utility
      ansible.builtin.apt:
        name: apache2-utils
        state: present

    - name: Create phpMyAdmin access credentials
      ansible.builtin.command:
        argv:
          - htpasswd
          - -c
          - -i
          - -B
          - /opt/cloud-1/nginx/.htpasswd
          - "{{ vault_pma_gate_user }}"
        stdin: "{{ vault_pma_gate_password }}"
        stdin_add_newline: true
        creates: /opt/cloud-1/nginx/.htpasswd
      no_log: true

    - name: Deploy Nginx configuration
      ansible.builtin.copy:
        src: docker/nginx/default.conf
        dest: /opt/cloud-1/nginx/default.conf
        mode: '0644'
      notify: Validate and reload Nginx

    - name: Create ACME directory
      ansible.builtin.file:
        path: /opt/cloud-1/acme/.well-known/acme-challenge
        state: directory
        mode: '0755'

    - name: Create temporary test file
      ansible.builtin.copy:
        content: "cloud1-acme-ready"
        dest: /opt/cloud-1/acme/.well-known/acme-challenge/test.txt
        mode: '0644'

    - name: start Cloud-1 Docker Compose services
      community.docker.docker_compose_v2:
        project_src: /opt/cloud-1
        state: present

    - name: Install Certbot
      ansible.builtin.apt:
        name: certbot
        state: present

    - name: Obtain Cloud-1 TLS certificate
      ansible.builtin.command:
        argv:
          - certbot
          - certonly
          - --webroot
          - -w
          - /opt/cloud-1/acme
          - -d
          - cloud1-42project.duckdns.org
          - --email
          - "{{ vault_letsencrypt_email }}"
          - --agree-tos
          - --non-interactive
        creates: /etc/letsencrypt/live/cloud1-42project.duckdns.org/fullchain.pem

    - name: Check Worpress installation
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - /opt/cloud-1/docker-compose.yml
          - run
          - --rm
          - --no-deps
          - -T
          - wpcli
          - wp
          - core
          - is-installed
      register: wp_install_status
      changed_when: false
      failed_when: wp_install_status.rc not in [0, 1]

    - name: Install Wordpress
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - /opt/cloud-1/docker-compose.yml
          - run
          - --rm
          - --no-deps
          - -T
          - wpcli
          - wp
          - core
          - install
          - --url=https://cloud1-42project.duckdns.org
          - --title=Cloud-1
          - "--admin_user={{ vault_wp_admin_user }}"
          - "--admin_email={{ vault_wp_admin_email }}"
          - --prompt=admin_password
        stdin: "{{ vault_wp_admin_password }}"
        stdin_add_newline: true
      when: wp_install_status.rc == 1
      no_log: true

  handlers:
    - name: Validate and reload Nginx
      ansible.builtin.shell: >
        docker exec cloud-1-nginx-1 nginx -t &&
        docker exec cloud-1-nginx-1 nginx -s reload